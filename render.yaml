services:
  - type: web
    name: bhashachain-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt -r backend/requirements-qpiai-opt.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: API_ACCESS_TOKEN
        generateValue: true
      - key: ISSUER_SIGNING_SECRET
        generateValue: true
      # Production must not treat local SQLite-only demo records as trusted.
      # Registry operations require a reachable configured ledger.
      - key: BLOCKCHAIN_MODE
        value: required
      - key: BLOCKCHAIN_RPC_URL
        sync: false
      - key: BLOCKCHAIN_CHAIN_ID
        sync: false
      - key: RIGHTS_LEDGER_ADDRESS
        sync: false
      - key: BLOCKCHAIN_SENDER_ADDRESS
        sync: false
      - key: BLOCKCHAIN_PRIVATE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: QPIAI_OPT_API_KEY
        sync: false
